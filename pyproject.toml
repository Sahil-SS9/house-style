[project]
name = "house-style"
version = "0.3.1"
description = "Learn a project's house style from how you correct an agent's edits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sahil-SS9" }]

# No runtime dependencies: the core is standard library only, and the Hermes
# adapter uses the host's own plugin API. Anything added here also has to be
# declared in plugin.yaml (`python_dependencies`) for host-managed installs.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_style_core", "src/house_style_hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
