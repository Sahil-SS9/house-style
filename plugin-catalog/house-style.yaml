name: house-style
repo: https://github.com/Sahil-SS9/house-style
sha: af7a275de933eea2e053d61effbf7f8354f4b7e2
version: "0.1.0"
description: >-
  Learns a project's house style from how you correct the agent's edits. Every
  write_file and patch records the block it introduced; later the plugin checks whether
  you kept it, rewrote it or took it out again, and /house-style learn distils a bounded
  batch of those before/after pairs into short numbered preferences in
  .hermes/house-style.md, which you own and can edit. /house-style status shows the
  counts per project and the newest edited pairs, scan re-checks the recorded edits,
  learn confirm writes the file after showing you the diff, reset clears signals and
  learned lines while keeping anything you wrote, off/on stop or resume recording for
  one project, and export prints the file. Disclosure — registers post_tool_call (for
  write_file and patch only), on_session_start and pre_llm_call; reads the arguments
  those tools were given and the working-tree files they just wrote, inside a git
  repository only, skipping files larger than 256 KB, binary files, secret-like names
  (.env, *.pem, id_rsa*, credentials*) and Hermes' protected paths; stores redacted
  before/after pairs (repository-relative path, hash, up to 200 lines per block, up to
  400 rows and 512 KB per repository) in plugin-data/house-style, and writes
  .hermes/house-style.md in the project only after /house-style learn confirm; calls your
  configured model once per /house-style learn and nothing else; no telemetry, no
  subprocesses, no network beyond that model call.
maintainer: Sahil-SS9
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Sahil-SS9/house-style#readme
platforms: []
capabilities:
