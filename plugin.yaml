name: house-style
version: 0.3.1
manifest_version: 2
description: "Learn a project's house style from how you correct the agent's edits: records the blocks write_file and patch introduce (including multi-file V4A patches and replace_all), notices which you keep, rewrite or revert, and distils the pattern into the project context file Hermes already loads (AGENTS.md, or .hermes.md, CLAUDE.md, .cursorrules when one of those is already in use), inside a marked block you own. Disclosure — registers post_tool_call (write_file and patch only) and on_session_start; reads the tool arguments and reads back the files those tools just wrote, on the host or through the read_file tool for a remote backend, inside a git repository only; stores redacted before/after pairs in plugin-data; writes one marked section of the project context file and only after /house-style learn confirm; calls your configured model once per /house-style learn; no other network access, no subprocesses."
author: "Sahil-SS9"
license: MIT
homepage: https://github.com/Sahil-SS9/house-style
requires_hermes: ">=0.23.0"
provides_hooks:
  - post_tool_call
  - on_session_start
provides_tools: []
requires_env: []
tags:
  - memory
  - workflow
  - style
